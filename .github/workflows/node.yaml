name: Node.js CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'

# Cancel superseded PR checks; keep every non-PR invocation independent.
concurrency:
  group: node.yaml-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16.x]
    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Yarn
        run: npm install -g yarn
      - run: yarn
      - run: yarn build
      - name: Uninstall Yarn
        if: always()
        run: npm uninstall -g yarn
