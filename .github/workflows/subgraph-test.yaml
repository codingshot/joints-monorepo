name: Subgraph CI

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - 'packages/nouns-contracts/abi/contracts/**'
      - 'packages/nouns-subgraph/**'
    branches:
      - '**'

# Cancel superseded PR checks; keep every non-PR invocation independent.
concurrency:
  group: subgraph-test.yaml-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_and_test:
    timeout-minutes: 60
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: recursive
      - name: Use Node.js 16.x
        uses: actions/setup-node@v1
        with:
          node-version: 16.x
      - name: Install Yarn
        run: npm install -g yarn
      - run: yarn
      - run: yarn build
      - name: Prepare subgraph yaml
        run: |
          cd packages/nouns-subgraph
          yarn prepare:rinkeby
      - name: Generate code
        run: |
          cd packages/nouns-subgraph
          yarn codegen
      - name: Generate config
        run: |
          cd packages/nouns-subgraph
          yarn test:configgen
      - name: Run tests
        run: |
          cd packages/nouns-subgraph
          yarn test
      - name: Uninstall Yarn
        if: always()
        run: npm uninstall -g yarn
